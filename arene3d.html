<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Évala · prototype 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #17110d; overflow: hidden; font-family: 'Instrument Sans', sans-serif; color: #efe6d6; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #tag { position: fixed; left: 18px; bottom: 16px; background: rgba(23,17,13,.7); padding: 10px 14px; border-radius: 10px; font-size: 13px; max-width: 520px; line-height: 1.4; }
    #tag b { font-family: 'Big Shoulders Display'; font-size: 22px; text-transform: uppercase; display: block; }
    #fps { position: fixed; right: 18px; top: 14px; font-size: 13px; opacity: .8; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="tag"><b>Prototype 3D · socle Three.js</b>Arène en vraie 3D : soleil et ombres portées, sol de latérite, collines, foule peinte en panneaux, poussière. Les deux personnages sont des modèles de test rigués (exemples Three.js, rigs Mixamo) : ils seront remplacés par les lutteurs.</div>
  <div id="fps"></div>
  <script type="module">
    import { Arena3D, BASE } from './src/three/arena3d.js';
    const A = new Arena3D(document.getElementById('c'), { mood: 'aprem' });
    const a = await A.addCharacter(`${BASE}models/Soldier.glb`, { x: -1.1, z: 0, facing: Math.PI / 2, anim: 'Idle' });
    const b = await A.addCharacter(`${BASE}models/Xbot.glb`, { x: 1.1, z: 0, facing: -Math.PI / 2, anim: 'idle' });
    console.log('clips', a.clips, b.clips);
    let last = performance.now(), frames = 0, acc = 0, phase = 0;
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      A.update(dt);
      // petite mise en scène : ils marchent l'un vers l'autre, puis se font face
      phase += dt;
      const k = (phase % 10);
      if (k < 3) { a.play('Walk'); b.play('walk'); a.model.position.x = -3 + k * 0.63; b.model.position.x = 3 - k * 0.63; }
      else if (k < 8) { a.play('Idle'); b.play('idle'); }
      else { a.play('Run'); b.play('agree'); }
      // caméra qui tourne lentement
      const ang = Math.sin(now * 0.00012) * 0.5;
      A.camera.position.set(Math.sin(ang) * 8.5, 1.7 + Math.sin(now * 0.0003) * 0.2, Math.cos(ang) * 8.5);
      A.camera.lookAt(0, 1.0, 0);
      A.render();
      frames++; acc += dt; if (acc > 1) { document.getElementById('fps').textContent = `${Math.round(frames / acc)} i/s`; frames = 0; acc = 0; }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    window.__a3 = A;
  </script>
</body>
</html>
